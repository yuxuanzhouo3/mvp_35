[pytest]
addopts = --import-mode=importlib
testpaths = test
pythonpath =
    backend
    .
markers =
    mvp: MVP gate — unit, smoke, e2e, api, migration, rollback
    svp: SVP gate — integration, contract, ui, regression, tenant, payment, KPI
    business: Business gate — performance, security, AI, data, compatibility, localization
    speedup1: Speed up 1 — chaos, canary, A/B, consistency
    speedup2: Speed up 2 — compliance, observability
    speedup3: Speed up 3 — global flag and global rollback
