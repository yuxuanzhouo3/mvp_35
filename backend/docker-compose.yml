services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      AUTH_MODE: demo
      DATA_PATH: /data/store.json
      HUNYUAN_ENABLED: "false"
      TONGYI_ENABLED: "false"
      SES_MODE: mock
      WECHAT_PAY_MODE: disabled
    volumes:
      - pgdata:/data
  worker:
    build: .
    command: python -m app.workers.loop
    environment:
      AUTH_MODE: demo
      DATA_PATH: /data/store.json
      HUNYUAN_ENABLED: "false"
      SES_MODE: mock
      WECHAT_PAY_MODE: disabled
    volumes:
      - pgdata:/data

volumes:
  pgdata:
