[project]
name = "pickglobal-api"
version = "1.0"
description = "PickGlobal API: product analysis reports and nine-channel acquisition"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2",
  "pydantic-settings>=2",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "config*", "db*"]
